[project]
name = "qualcoder"
version = "4.1.0.dev0"
description = "The free, open source desktop software for qualitative data analysis"
readme = "README.md"
authors = [
  { name = "Colin Curtain", email = "ccbogel@hotmail.com" },
  { name = "Kai Dröge" },
  { name = "Justin Missaghieh-Poncet" },
  { name = "Lorenzo Salomón Cárdenas" },
]
requires-python = ">=3.12"
dependencies = [
  "bio>=1.8.4",
  "charset-normalizer>=3.5.2",
  "diff-match-patch>=20241021",
  "ebooklib>=0.21",
  "emoji>=2.16.0",
  "faiss-cpu>=1.15.1",
  "json-repair>=0.64.3",
  "langchain>=0.2.8",
  "langchain-community>=0.2.7",
  "langchain-core>=0.2.19",
  "langchain-openai>=1.3.1",
  "langchain-text-splitters>=0.2.2",
  "markdown-it-py>=4.2.0",
  "matplotlib>=3.11.2",
  "mcp>=2.2,<3",
  "networkx>=3.7",
  "odfpy>=1.4.1",
  "openpyxl>=3.1.5",
  "pandas>=3.1.0",
  "pdfminer-six>=20260107",
  # The bootloader in the most recent version of pyinstaller is often falsely detected as malware
  # by anti virus software, so, it's safer to use a version that has been released a few months ago.
  "pefile<2024.8.26", # see: https://github.com/pyinstaller/pyinstaller/issues/8832#issuecomment-2413203254
  "pillow>=13.0.0",
  "plotly>=7.1.0",
  "ply>=3.11",
  "pyinstaller<=6.15",
  "pylatexenc>=2.10,<3",
  "pymupdf>=2.0",
  "pyqt6>=6.5",
  "python-vlc>=3.0.21203",
  "pyyaml>=6.0.3",
  "qtawesome>=1.4.2",
  "requests>=2.34.2",
  "rispy>=0.10.0",
  "sentence-transformers>=5.7.0",
  "six>=1.17.0",
  "striprtf>=0.0.35",
  "transformers<=4.53.0", # see https://github.com/huggingface/transformers/issues/38402 
  "uvicorn>=0.30,<1",
  "wordcloud>=1.9.6",
]

[project.scripts]
qualcoder = "qualcoder.__main__:gui"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
    "uv>=0.13.6",
]

# Makes sure that torch CPU is installed instead of CUDA, this saves space
[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# So ruff stops flaging gettetx syntax as a problemm
[tool.ruff]
builtins = [
  "_",
  "gettext",
  "ngettext",
  "ugettext",
  "pgettext",
  "my_gettext",
]

[tool.ruff.lint.flake8-gettext]
function-names = [
  "_",
  "gettext",
  "ngettext",
  "ugettext",
  "pgettext",
  "my_gettext",
]
