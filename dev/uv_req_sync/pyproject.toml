[project]
name = "uv-req-sync"
version = "1"
description = "A simple tool for synching pyproject.toml with requirements.txt"
readme = "README.md"
authors = [
    { name = "Alberto Antonio Rebonatto Neto", email = "beto.rebonatto.neto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tomli-w>=1.2.0",
]

[project.scripts]
uv-req-sync = "uv_req_sync.__main__:main"
force-req-sync = "uv_req_sync.__main__:process"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
