name: Build QualCoder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex: 4.0 ou 4-0)'
        required: true
        type: string

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm

      - name: Build with PyInstaller
        env:
          QUALCODER_VERSION: ${{ github.event.inputs.version }}
        run: pyinstaller qualcoder_onefile.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QualCoder-Windows_${{ github.event.inputs.version }}
          path: dist/

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Create dist directories
        run: mkdir -p dist/dmg dist/app

      - name: Make build script executable
        run: chmod +x ./mac_build-dmg.sh

      - name: Build DMG
        run: ./mac_build-dmg.sh "${{ github.event.inputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QualCoder-macOS_${{ github.event.inputs.version }}
          path: |
            dist/
            *.dmg

  build-debian:
    name: Build for Debian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y dpkg

      - name: Create dist directory
        run: mkdir -p dist

      - name: Make build script executable
        run: chmod +x ./debian_build-deb.sh

      - name: Build DEB
        run: ./debian_build-deb.sh "${{ github.event.inputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QualCoder-Debian_${{ github.event.inputs.version }}
          path: |
            dist/
            *.deb
