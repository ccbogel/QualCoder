name: Build and Release QualCoder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex: 4.0 ou 4-0)'
        required: true
        type: string

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm regex requests filelock

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build with PyInstaller
        run: pyinstaller qualCoder_onefile.spec

      - name: Rename output file
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          Get-ChildItem dist\*.exe | Rename-Item -NewName { "QualCoder_Windows_$version.exe" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install create-dmg and dependencies
        run: |
          brew install create-dmg
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm regex requests filelock

      - name: Create dist directories
        run: mkdir -p dist/dmg dist/app

      - name: Build with PyInstaller
        run: pyinstaller qualCoder.spec --distpath dist/app

      - name: Make build script executable
        run: chmod +x ./mac_build-dmg.sh

      - name: Build DMG
        run: ./mac_build-dmg.sh "${{ github.event.inputs.version }}"

      - name: Rename DMG file
        run: |
          mv dist/*.dmg "dist/QualCoder_macOS_${{ github.event.inputs.version }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg

  build-debian:
    name: Build for Debian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm regex requests filelock
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Linux executable with PyInstaller
        run: pyinstaller qualCoder_onefile.spec

      - name: Rename Linux executable
        run: |
          mv dist/QualCoder "dist/QualCoder_Linux_${{ github.event.inputs.version }}"

      - name: Make build script executable
        run: chmod +x ./debian_build-deb.sh

      - name: Build DEB
        run: ./debian_build-deb.sh "${{ github.event.inputs.version }}"

      - name: Rename DEB file
        run: |
          mv dist/*.deb "dist/QualCoder_Debian_${{ github.event.inputs.version }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-build
          path: dist/

  create-release:
    name: Create Draft Release
    needs: [build-windows, build-macos, build-debian]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: QualCoder ${{ github.event.inputs.version }}
          draft: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
