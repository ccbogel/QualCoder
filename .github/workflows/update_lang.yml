name: Execute rebuild_lang.py

on:
  workflow_dispatch:
    inputs:
      script_args:
        description: "Arguments pour rebuild_lang.py (ex: --update --lang fr)"
        required: false
        default: "--update"

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install lxml polib PyQt5

      - name: Install gettext and Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext qttools5-dev-tools

      - name: Verify tools are installed
        run: |
          which xgettext || echo "xgettext not found"
          which msgmerge || echo "msgmerge not found"
          which pylupdate5 || echo "pylupdate5 not found"
          which lrelease || echo "lrelease not found"

      - name: Add Qt tools to PATH
        run: |
          echo "/usr/lib/qt5/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH

      - name: Execute rebuild_lang.py
        run: python rebuild_lang.py ${{ github.event.inputs.script_args }}
