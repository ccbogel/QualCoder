name: Execute rebuild_lang.py

on:
  workflow_dispatch:
    inputs:
      script_args:
        description: "Arguments for rebuild_lang.py (e.g., --update)"
        required: false
        default: "--update"

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext qttools5-dev-tools

      - name: Check gettext version
        run: xgettext --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml polib PyQt5

      - name: Add Qt tools to PATH
        run: |
          echo "/usr/lib/qt5/bin" >> $GITHUB_PATH

      - name: Execute rebuild_lang.py
        run: python rebuild_lang.py ${{ github.event.inputs.script_args }}

      - name: Check for changes
        id: verify_changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify_changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update translation files (${{ github.event.inputs.script_args }})"
          git push
