name: Execute rebuild_lang.py

on:
  workflow_dispatch:
    inputs:
      script_args:
        description: "Args"
        required: false
        default: "--update"

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (gettext, Qt tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext qttools5-dev-tools python3-lxml python3-polib

      - name: Add Qt tools to PATH
        run: |
          echo "/usr/lib/qt5/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH
          
      - name: Execute rebuild_lang.py
        run: python rebuild_lang.py ${{ github.event.inputs.script_args }}
